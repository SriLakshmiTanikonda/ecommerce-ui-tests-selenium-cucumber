# Default settings. Any value can be overridden on the command line, e.g.
#   mvn test -Dbrowser=firefox -Dheadless=false
# or with an environment variable (dots become underscores): BROWSER=firefox

# Applications under test
internet.url=https://the-internet.herokuapp.com
saucedemo.url=https://www.saucedemo.com

# Browser
browser=chrome
headless=true

# Selenium Grid URL, e.g. http://localhost:4444. Leave empty to run browsers locally.
grid.url=

# Timeouts
explicit.wait.seconds=10
page.load.timeout.seconds=30

# Highlight elements before interacting (useful when watching a headed run)
highlight.elements=false
